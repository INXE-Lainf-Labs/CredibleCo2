name: Revision Restored Results

on:
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - scripts/build_revision_restored_results.py
      - scripts/recompute_ev_test_sensitivity.py
      - .github/workflows/revision-restored-results.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      FIVE_SEED_RUN_ID: '30742131505'
      SINGLE_RUN_ID: '30725904091'
      TARGET_BRANCH: revision-r2-reviewer3-4
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn matplotlib pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download audited checkpoints
        run: |
          rm -rf downloaded-five-seeds downloaded-single-run
          mkdir -p downloaded-five-seeds downloaded-single-run
          gh run download "$FIVE_SEED_RUN_ID" --dir downloaded-five-seeds
          gh run download "$SINGLE_RUN_ID" --dir downloaded-single-run
          test "$(find downloaded-five-seeds -name '*_emissions_seed*.json' | wc -l)" -eq 20
          test "$(find downloaded-five-seeds -name '*_emissions_seed*_best.pt' | wc -l)" -eq 20
          test "$(find downloaded-single-run -name 'ev_emissions.json' | wc -l)" -eq 1
          test "$(find downloaded-single-run -name 'ev_feature.json' | wc -l)" -eq 1
          test "$(find downloaded-single-run -name 'ev_emissions_best.pt' | wc -l)" -eq 1
          test "$(find downloaded-single-run -name 'ev_feature_best.pt' | wc -l)" -eq 1

      - name: Rebuild full first-revision result set
        run: |
          rm -rf artifacts/revision_restored_results
          python scripts/build_revision_restored_results.py \
            --five-seed-dir downloaded-five-seeds \
            --ev-single-dir downloaded-single-run \
            --output-dir artifacts/revision_restored_results \
            --batch-size 2048 \
            --threads 4

      - name: Recompute electricity-factor sensitivity on corrected test trips
        run: |
          rm -rf artifacts/revision_ev_electricity_sensitivity
          python scripts/recompute_ev_test_sensitivity.py \
            --output-dir artifacts/revision_ev_electricity_sensitivity

      - name: Verify outputs
        run: |
          test "$(find artifacts/revision_restored_results -maxdepth 1 -name 'figure_*.png' | wc -l)" -eq 9
          test "$(find artifacts/revision_restored_results -maxdepth 1 -name 'figure_*.pdf' | wc -l)" -eq 9
          test "$(find artifacts/revision_restored_results -maxdepth 1 -name 'figure_*.tiff' | wc -l)" -eq 9
          test -f artifacts/revision_restored_results/table_bootstrap_complete.csv
          test -f artifacts/revision_restored_results/table_ev_trip_metrics_complete.csv
          test -f artifacts/revision_restored_results/restored_tables_corrected.tex
          test -f artifacts/revision_ev_electricity_sensitivity/electricity_factor_sensitivity_test_trips.csv
          test -f artifacts/revision_ev_electricity_sensitivity/ev_test_trip_totals.csv
          test -f artifacts/revision_ev_electricity_sensitivity/sensitivity_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/revision_restored_results/restored_results_manifest.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['status'] == 'completed_restored_first_revision_results'
          assert x['split_seed'] == 20260801
          assert len(x['bootstrap_summary']) == 6
          diff = next(r for r in x['bootstrap_summary'] if r['metric'] == 'Proxy - direct')
          assert diff['mean'] > 0 and diff['ci_low'] > 0
          assert x['protocol_checks']['test_set_used_for_model_selection'] is False
          s = json.loads(Path('artifacts/revision_ev_electricity_sensitivity/sensitivity_manifest.json').read_text(encoding='utf-8'))
          assert s['status'] == 'completed_ev_test_trip_sensitivity'
          assert s['split_seed'] == 20260801
          assert s['n_test_trips'] == 14
          assert abs(s['previous_total_difference_gco2']) < 1.0
          print(json.dumps({'proxy_minus_direct': diff, 'sensitivity': s['scenario_summary']}, indent=2))
          PY

      - name: Commit regenerated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/revision_restored_results artifacts/revision_ev_electricity_sensitivity
          if git diff --cached --quiet; then
            echo "No restored-result changes to commit"
            exit 0
          fi
          git commit -m "Restore corrected results and EV test sensitivity"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "Concurrent branch update detected; retrying (${attempt}/5)"
            sleep $((attempt * 5))
          done
          echo "Unable to publish restored results after five attempts" >&2
          exit 1

      - name: Upload restored result package
        uses: actions/upload-artifact@v4
        with:
          name: revision-restored-results
          path: |
            artifacts/revision_restored_results
            artifacts/revision_ev_electricity_sensitivity
          if-no-files-found: error
          retention-days: 90
