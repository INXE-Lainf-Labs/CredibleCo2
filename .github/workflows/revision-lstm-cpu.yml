name: Revision LSTM CPU

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: false
        default: '20'
      max_train_windows:
        description: Maximum training windows; large default means all available windows
        required: false
        default: '999999999'
      max_validation_windows:
        description: Maximum validation windows; large default means all available windows
        required: false
        default: '999999999'
      max_test_windows:
        description: Maximum test windows; large default means all available windows
        required: false
        default: '999999999'
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - scripts/run_revision_lstm_cpu.py
      - src/revision_protocol.py
      - src/models/LSTM.py
      - .github/workflows/revision-lstm-cpu.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_revision_lstm_cpu.py
      - src/revision_protocol.py
      - src/models/LSTM.py
      - .github/workflows/revision-lstm-cpu.yml

jobs:
  lstm-cpu:
    name: ${{ matrix.dataset }} LSTM CPU
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset: [qx50, blazer, pacifica, ev]

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify repository imports
        run: python -c "from src.models.LSTM import MultipleLayerLSTM; from src.revision_protocol import DATASETS; print('imports ok')"

      - name: Run corrected emissions LSTM on CPU
        env:
          EPOCHS: ${{ inputs.epochs || '20' }}
          MAX_TRAIN: ${{ inputs.max_train_windows || '999999999' }}
          MAX_VALIDATION: ${{ inputs.max_validation_windows || '999999999' }}
          MAX_TEST: ${{ inputs.max_test_windows || '999999999' }}
        run: |
          python scripts/run_revision_lstm_cpu.py \
            --dataset ${{ matrix.dataset }} \
            --epochs "$EPOCHS" \
            --max-train-windows "$MAX_TRAIN" \
            --max-validation-windows "$MAX_VALIDATION" \
            --max-test-windows "$MAX_TEST"

      - name: Run corrected EV feature LSTM on CPU
        if: matrix.dataset == 'ev'
        env:
          EPOCHS: ${{ inputs.epochs || '20' }}
          MAX_TRAIN: ${{ inputs.max_train_windows || '999999999' }}
          MAX_VALIDATION: ${{ inputs.max_validation_windows || '999999999' }}
          MAX_TEST: ${{ inputs.max_test_windows || '999999999' }}
        run: |
          python scripts/run_revision_lstm_cpu.py \
            --dataset ev \
            --feature-model \
            --epochs "$EPOCHS" \
            --max-train-windows "$MAX_TRAIN" \
            --max-validation-windows "$MAX_VALIDATION" \
            --max-test-windows "$MAX_TEST"

      - name: Upload CPU LSTM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revision-lstm-cpu-${{ matrix.dataset }}
          path: artifacts/revision_lstm_cpu/${{ matrix.dataset }}_*
          if-no-files-found: error
