name: Tuned EV Proxy Composition

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_tuned_ev_proxy_composition.py
      - .github/workflows/tuned-ev-proxy-composition.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lstm-validation-tuning

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download tuned checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded/emissions downloaded/feature
          gh api repos/${{ github.repository }}/actions/artifacts/8883651979/zip > emissions.zip
          gh api repos/${{ github.repository }}/actions/artifacts/8886132818/zip > feature.zip
          unzip -q emissions.zip -d downloaded/emissions
          unzip -q feature.zip -d downloaded/feature
          find downloaded -maxdepth 3 -type f -print

      - name: Verify canonical BMW i3 dataset already in the repository
        run: |
          test -f data/eletrico_ieee.csv
          echo '8ccb1489d4d041e5688e1aa808921c1f7694fb6968521f77b619bee8cafb8262  data/eletrico_ieee.csv' | sha256sum -c -

      - name: Run tuned end-to-end composition
        run: |
          python scripts/run_tuned_ev_proxy_composition.py \
            --dataset data/eletrico_ieee.csv \
            --emissions-checkpoint downloaded/emissions/final_emissions_ev_w10_h64_b2_clip1p0_raw_seed20260801.pt \
            --feature-checkpoint downloaded/feature/final_feature_ev_w10_h64_b4_clip1p0_raw_seed20260801.pt \
            --output-dir artifacts/tuned_ev_proxy_composition

      - name: Show result summary
        run: cat artifacts/tuned_ev_proxy_composition/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: tuned-ev-proxy-composition
          path: artifacts/tuned_ev_proxy_composition
          if-no-files-found: error
          retention-days: 90
