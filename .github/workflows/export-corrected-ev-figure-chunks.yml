name: Export Corrected EV Figure Chunks

on:
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - .github/workflows/export-corrected-ev-figure-chunks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: revision-r2-reviewer3-4
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Build text chunks for corrected EV figures
        run: |
          set -euo pipefail
          src=artifacts/revision_restored_results
          test -f "$src/figure_ev_torque_throttle_measured_predicted.png"
          test -f "$src/figure_ev_direct_proxy_observed.png"
          rm -rf artifacts/corrected_ev_figure_export
          mkdir -p artifacts/corrected_ev_figure_export/payload
          cp "$src/figure_ev_torque_throttle_measured_predicted.png" artifacts/corrected_ev_figure_export/payload/
          cp "$src/figure_ev_direct_proxy_observed.png" artifacts/corrected_ev_figure_export/payload/
          tar -C artifacts/corrected_ev_figure_export/payload -czf /tmp/corrected_ev_figures.tar.gz .
          base64 -w 76 /tmp/corrected_ev_figures.tar.gz > /tmp/corrected_ev_figures.b64
          split -d -a 3 -l 1200 /tmp/corrected_ev_figures.b64 artifacts/corrected_ev_figure_export/part_
          sha256sum /tmp/corrected_ev_figures.tar.gz | awk '{print $1}' > artifacts/corrected_ev_figure_export/archive.sha256
          wc -c /tmp/corrected_ev_figures.tar.gz | awk '{print $1}' > artifacts/corrected_ev_figure_export/archive.bytes
          find artifacts/corrected_ev_figure_export -maxdepth 1 -name 'part_*' -printf '%f\n' | sort > artifacts/corrected_ev_figure_export/parts.txt
          rm -rf artifacts/corrected_ev_figure_export/payload
      - name: Commit text chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/corrected_ev_figure_export
          git commit -m "Export corrected EV figures as text chunks"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:${TARGET_BRANCH}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
