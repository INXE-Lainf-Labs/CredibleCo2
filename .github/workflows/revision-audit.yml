name: Revision audit

on:
  workflow_dispatch:
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - scripts/revision_audit.py
      - .github/workflows/revision-audit.yml
      - data/**

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Run reproducibility and covariate audit
        run: python scripts/revision_audit.py

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revision-audit
          path: artifacts/revision_audit.*
          if-no-files-found: error
