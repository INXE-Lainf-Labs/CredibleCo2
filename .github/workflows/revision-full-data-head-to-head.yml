name: Revision full-data head-to-head

on:
  workflow_dispatch:
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - scripts/run_revision_full_data_head_to_head.py
      - scripts/run_revision_experiments.py
      - src/revision_protocol.py
      - .github/workflows/revision-full-data-head-to-head.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/run_revision_full_data_head_to_head.py
      - scripts/run_revision_experiments.py
      - src/revision_protocol.py
      - .github/workflows/revision-full-data-head-to-head.yml

jobs:
  benchmark:
    name: ${{ matrix.dataset }} full-data benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset: [ev, qx50]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn

      - name: Run exact full-data head-to-head benchmark
        run: |
          python scripts/run_revision_full_data_head_to_head.py \
            --dataset ${{ matrix.dataset }}

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revision-full-data-head-to-head-${{ matrix.dataset }}
          path: artifacts/revision_full_data_head_to_head/${{ matrix.dataset }}.*
          if-no-files-found: error
