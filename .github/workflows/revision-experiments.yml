name: Revision experiments

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated models
        required: false
        default: ridge,hist_gb,random_forest,mlp
      max_train_windows:
        description: Maximum training windows per experiment
        required: false
        default: '200000'
      max_validation_windows:
        description: Maximum validation windows per experiment
        required: false
        default: '100000'
      max_test_windows:
        description: Maximum test windows per experiment
        required: false
        default: '150000'
  push:
    branches:
      - revision-r2-reviewer3-4
    paths:
      - src/revision_protocol.py
      - scripts/run_revision_experiments.py
      - .github/workflows/revision-experiments.yml

jobs:
  experiments:
    name: ${{ matrix.dataset }} corrected protocol
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        dataset: [ev, qx50, blazer, pacifica]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn

      - name: Run corrected-protocol benchmarks and ablations
        env:
          MODELS: ${{ inputs.models || 'ridge,hist_gb,random_forest,mlp' }}
          MAX_TRAIN: ${{ inputs.max_train_windows || '200000' }}
          MAX_VALIDATION: ${{ inputs.max_validation_windows || '100000' }}
          MAX_TEST: ${{ inputs.max_test_windows || '150000' }}
        run: |
          python scripts/run_revision_experiments.py \
            --dataset ${{ matrix.dataset }} \
            --models "$MODELS" \
            --max-train-windows "$MAX_TRAIN" \
            --max-validation-windows "$MAX_VALIDATION" \
            --max-test-windows "$MAX_TEST"

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revision-experiments-${{ matrix.dataset }}
          path: artifacts/revision_experiments/${{ matrix.dataset }}.*
          if-no-files-found: error
